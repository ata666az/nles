build:
  command: "npm install"
  system: auto
  min_cpu: 0.25
  max_cpu: 2
  min_memory: 256
  max_memory: 1024

start_command: "node server.js"

scaling:
  trigger: http_requests
  min_cpu: 0.1
  max_cpu: 1
  min_memory: 256
  max_memory: 1024
  min_replicas: 1
  max_replicas: 3
  max_http_requests_per_replica: 100

health_check:
  type: http
  http_path: "/health"
  interval_in_seconds: 30
